<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Commerce Store</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
<nav class="bg-white shadow-md px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">

    <div class="text-3xl font-bold text-blue-600">
        ShopEasy
    </div>

    <div class="w-full md:w-1/2">
        <input
            type="text"
            placeholder="Search products..."
            class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
    </div>

    <button class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition">
        🛒 Cart (0)
    </button>

</nav>
<section class="max-w-7xl mx-auto px-6 py-10">

    <h2 class="text-3xl font-bold mb-8 text-center">
        Featured Products
    </h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
        <div class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl transition duration-300">

            <div class="overflow-hidden">
                <img
                    src="../../HTML/Assets/photo2.jpg"
                    alt="Product"
                    class="w-full h-64 object-cover hover:scale-110 transition duration-500"
                >
            </div>

            <div class="p-5">
                <h3 class="text-xl font-semibold">
                    Premium T-Shirt
                </h3>

                <p class="text-green-600 text-2xl font-bold mt-2">
                    ₹999
                </p>

                <div class="text-yellow-500 mt-2">
                    ⭐⭐⭐⭐⭐
                </div>

                <button class="w-full mt-4 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                    Add To Cart
                </button>
            </div>

        </div>
        <div class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl transition duration-300">

            <div class="overflow-hidden">
                <img
                    src="../../HTML/Assets/photo1.jpg"
                    alt="Shoes"
                    class="w-full h-64 object-cover hover:scale-110 transition duration-500"
                >
            </div>

            <div class="p-5">
                <h3 class="text-xl font-semibold">
                    Running Shoes
                </h3>

                <p class="text-green-600 text-2xl font-bold mt-2">
                    ₹2,499
                </p>

                <div class="text-yellow-500 mt-2">
                    ⭐⭐⭐⭐☆
                </div>

                <button class="w-full mt-4 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                    Add To Cart
                </button>
            </div>

        </div>
        <div class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl transition duration-300">

            <div class="overflow-hidden">
                <img
                    src="../../HTML/Assets/photo3.jpg"
                    alt="Jacket"
                    class="w-full h-64 object-cover hover:scale-110 transition duration-500"
                >
            </div>

            <div class="p-5">
                <h3 class="text-xl font-semibold">
                    Winter Jacket
                </h3>

                <p class="text-green-600 text-2xl font-bold mt-2">
                    ₹3,499
                </p>

                <div class="text-yellow-500 mt-2">
                    ⭐⭐⭐⭐⭐
                </div>

                <button class="w-full mt-4 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                    Add To Cart
                </button>
            </div>

        </div>
        <div class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl transition duration-300">

            <div class="overflow-hidden">
                <img
                    src="../../HTML/Assets/photo4.jpg"
                    alt="Watch"
                    class="w-full h-64 object-cover hover:scale-110 transition duration-500"
                >
            </div>

            <div class="p-5">
                <h3 class="text-xl font-semibold">
                    Smart Watch
                </h3>

                <p class="text-green-600 text-2xl font-bold mt-2">
                    ₹4,999
                </p>

                <div class="text-yellow-500 mt-2">
                    ⭐⭐⭐⭐☆
                </div>

                <button class="w-full mt-4 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                    Add To Cart
                </button>
            </div>

        </div>

    </div>

</section>

</body>
</html>
