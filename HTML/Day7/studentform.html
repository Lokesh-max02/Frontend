<html>
    <head>
    <title>Student Form</title>

    </head>
    <body>
        <h1>Student Form</h1>
        <form>
            <label >Name:</label><br>
            <input type="text" name="name" required><br><br>

            <label >Email:</label><br>
            <input type="email" name="email"><br><br>
                <label >Password:</label><br>
            <input type="password" name="password"><br><br>
            <label >Phone Number:</label><br>
            <input type="tel" name="phone" placeholder="10 digit only" minlength="10" maxlength="10" required><br><br>
            <label >Date of Birth:</label><br>
            <input type="date" name="dob" required><br><br>
            <label >Age:</label><br>
            <input type="number" name="age" placeholder="Above 18yr only"><br><br>
            <label >Address:</label><br>
           <textarea name="address" rows="4" cols="50"></textarea><br><br>
           <label>Gender:</label><br>
           <input type="radio" name="gender" value="male"> Male
           <input type="radio" name="gender" value="female"> Female
           <input type="radio" name="gender" value="other"> Other<br><br>
              <label>Qualification:</label><br>
                <input type="checkbox" name="qualification"> High School
                <input type="checkbox" name="qualification"> Bachelor's Degree
                <input type="checkbox" name="qualification"> Master's Degree
                <input type="checkbox" name="qualification"> PhD<br><br>
                <label>Skills:</label><br>
                <select name="Skills" id="skills">
                    <option disabled selected="">Select Skills</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <br/><br/>
                
                    <input type="submit" value="Submit">
               </form>
                </select>
    </body>
</html>
