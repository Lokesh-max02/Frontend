<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fashion Ad Video Banner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .banner {
      width: 1400px;
      height: 300px;
      overflow: hidden;
      position: relative;
      border-radius: 20px;
      background: linear-gradient(to right, #111, #222);
      color: white;
      display: flex;
      align-items: center;
      padding: 30px;
    }

    .content {
      z-index: 2;
      width: 50%;
      animation: fadeIn 2s ease;
    }

    .content h1 {
      font-size: 60px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .content h2 {
      font-size: 32px;
      color: #ff4d4d;
      margin-bottom: 15px;
    }

    .content p {
      font-size: 20px;
      margin-bottom: 20px;
      color: #ddd;
    }

    .btn {
      display: inline-block;
      padding: 14px 35px;
      background: #ff4d4d;
      color: white;
      text-decoration: none;
      border-radius: 40px;
      font-size: 20px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ffffff;
      color: #111;
    }

    .models {
      position: absolute;
      right: 0;
      top: 0;
      width: 50%;
      height: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .models img {
      height: 280px;
      object-fit: contain;
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.5));
    }

    .offer {
      position: absolute;
      bottom: 20px;
      left: 30px;
      background: rgba(255,255,255,0.1);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 18px;
      backdrop-filter: blur(5px);
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>

  <div class="banner">
    <div class="content">
      <h1>STYLE STORM</h1>
      <h2>New Fashion Collection 2026</h2>
      <p>Trendy Shirts, T-Shirts & Track Pants for Men & Women</p>
      <a href="#" class="btn">Shop Now</a>
    </div>

    <div class="models">
      <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=1200&auto=format&fit=crop" alt="T-Shirt Model">
      <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=1200&auto=format&fit=crop" alt="Fashion Model">
    </div>

    <div class="offer">
      🔥 Flat 50% OFF on First Order | Free Shipping Available
    </div>
  </div>

</body>
</html>
