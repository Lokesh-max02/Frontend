<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dummy API Cards</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">

    <h1 class="text-3xl font-bold text-center my-8">
        Product Cards
    </h1>

    <div id="cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 p-6"></div>

    <script>
        async function fetchProducts() {
            try {
                const response = await fetch("https://dummyjson.com/products");
                const data = await response.json();

                const products = data.products;
                const cardContainer = document.getElementById("cards");

                products.forEach(product => {
                    cardContainer.innerHTML += `
                        <div class="bg-white rounded-xl shadow-lg overflow-hidden hover:scale-105 duration-300">
                            
                            <img src="${product.thumbnail}" 
                                 alt="${product.title}"
                                 class="w-full h-48 object-cover">

                            <div class="p-4">
                                <h2 class="text-xl font-bold mb-2">
                                    ${product.title}
                                </h2>

                                <p class="text-gray-600 text-sm mb-3">
                                    ${product.description}
                                </p>

                                <p class="text-green-600 font-bold text-lg">
                                    $${product.price}
                                </p>

                                <p class="text-yellow-500">
                                     ${product.rating}
                                </p>

                                <button class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-700">
                                    Buy Now
                                </button>
                            </div>

                        </div>
                    `;
                });

            } catch (error) {
                console.log(error);
            }
        }

        fetchProducts();
    </script>

</body>
</html>
