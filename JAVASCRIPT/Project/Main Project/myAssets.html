<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Assets</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:Inter,sans-serif;
}
</style>
</head>
<body>
    <body class="bg-slate-100">

<!-- ================= NAVBAR ================= -->

<nav class="fixed top-0 left-0 w-full h-16 bg-white shadow flex items-center justify-between px-8 z-50">

    <!-- Logo -->

    <div class="flex items-center gap-3">

       
        <div>

            <h1 class="font-bold text-xl text-slate-800">
                AssetsHub
            </h1>

            <p class="text-xs text-slate-500">
                Employee Dashboard
            </p>

        </div>

    </div>

    <!-- Search -->

    <div class="relative w-[420px]">

        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

        <input
        type="text"
        placeholder="Search Assets..."
        class="w-full rounded-xl border bg-slate-100 pl-11 pr-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">

    </div>

    <!-- Right -->

    <div class="flex items-center gap-6">

        <button class="relative">

            <i class="fa-regular fa-bell text-2xl text-slate-600"></i>

            <span class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 text-xs flex justify-center items-center">
                3
            </span>

        </button>

        <div class="flex items-center gap-3">

            <img
            src="../assets/icons/user (1).png"
            class="w-11 h-11 rounded-full border">

            <div>

                <h2 class="font-semibold">
                    Lokesh
                </h2>

                <p class="text-xs text-slate-500">
                    Employee
                </p>

            </div>

        </div>

    </div>

</nav>

<!-- ================= SIDEBAR ================= -->

<aside class="fixed top-16 left-0 w-64 h-[calc(100vh-64px)] bg-slate-900 text-white">

    <ul class="mt-8 space-y-2">

        <li>

            <a href="#"
            class="flex items-center gap-4 px-6 py-4 bg-blue-600">

                <i class="fa-solid fa-house"></i>

                Dashboard

            </a>

        </li>

        <li>

            <a href="#"
            class="flex items-center gap-4 px-6 py-4 hover:bg-slate-800 duration-300">

                <i class="fa-solid fa-laptop"></i>

                My Assets

            </a>

        </li>

        <li>

            <a href="#"
            class="flex items-center gap-4 px-6 py-4 hover:bg-slate-800 duration-300">

                <i class="fa-solid fa-plus"></i>

                Request Asset

            </a>

        </li>

        <li>

            <a href="#"
            class="flex items-center gap-4 px-6 py-4 hover:bg-slate-800 duration-300">

                <i class="fa-solid fa-arrow-rotate-left"></i>

                Return Request

            </a>

        </li>

        <li>

            <a href="#"
            class="flex items-center gap-4 px-6 py-4 hover:bg-slate-800 duration-300">

                <i class="fa-solid fa-screwdriver-wrench"></i>

                Report Issue

            </a>

        </li>

        <li>

            <a href="#"
            class="flex items-center gap-4 px-6 py-4 hover:bg-slate-800 duration-300">

                <i class="fa-solid fa-user"></i>

                My Profile

            </a>

        </li>

        <li>

            <a href="#"
            class="flex items-center gap-4 px-6 py-4 hover:bg-red-600 duration-300">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </a>

        </li>

    </ul>

</aside>

<!-- ================= MAIN CONTENT ================= -->
<main class="ml-64 mt-16 p-3">

<div>
    <h1 class="text-bold text-4xl mt-6 mb-3">My Assets</h1>
    <p>View all assigned company asstes</p>
</div>

    <div class="mt-3  flex  items-center gap-4 ">
        <div>
            <i class="fa-solid fa-magnifying-glass absolute left-70 top-53 -translate-y-1/2 text-slate-400"></i>

        <input
        type="text"
        placeholder="Search Assets..."
        class="w-50 rounded-xl border bg-slate-100 pl-11 pr-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 w-40">

        </div>
        <div class="relative">
    <select
        id="category"
        class="w-56 px-4 py-3 bg-white border border-gray-300 rounded-xl shadow-sm outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">

        <option value="all" selected>All Category</option>
        <option value="laptop">Laptop</option>
        <option value="monitor">Monitor</option>
        <option value="mouse">Mouse</option>
        <option value="keyboard">Keyboard</option>
        <option value="printer">Printer</option>
        <option value="scanner">Scanner</option>
        <option value="ups">UPS</option>
        <option value="projector">Projector</option>
        <option value="mobile">Mobile</option>
        <option value="tablet">Tablet</option>
        <option value="accessories">Accessories</option>

    </select>
</div>
<div>
    <select id="status" class="w-56 px-4 py-3 bg-white border border-gray-300 rounded-xl shadow-sm outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
        <option selected>All Status</option>
        <option value="Accepted">Accepted</option>
        <option value="Rejected">Rejected</option>
        <option value="Pending">Pending</option>
        <option value="Not View">Not View</option>
    </select>
</div>
<div>
    <select id="filter" class="w-56 px-4 py-3 bg-white border border-gray-300 rounded-xl shadow-sm outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
        <option selected>Sorted By</option>
        <option value="Newest">Newest</option>
        <option value="Oldest">Oldest</option>
        <option value="1 Month">1 Month</option>
        <option value="10 Month">10 Month</option>
    </select>
</div>
    </div>
<div>
    <div>
        
    </div>
</div>
</main>
</body>
</html>
