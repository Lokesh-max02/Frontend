<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
   
</head>

    <body class="bg-slate-100">

<div class="min-h-screen flex justify-center items-center">

    <div class="bg-white rounded-2xl shadow-2xl flex overflow-hidden w-[900px]">

        <!-- Form -->
        <div class="w-1/2 p-10">

            <h1 class="text-3xl font-bold text-gray-800 mb-2">
                Create Account
            </h1>

            <p class="text-gray-500 mb-8">
                Register to continue
            </p>

            <!-- Name -->
            <label class="font-medium text-gray-700">
                Name
            </label>

            <input
            id="name"
                type="text"
                placeholder="Enter your name"
                class="w-full border rounded-lg p-3 mt-2 mb-5 outline-none focus:ring-2 focus:ring-blue-500"
            >

            <!-- Email -->

            <label class="font-medium text-gray-700">
                Email
            </label>

            <input
            id="email"
                type="email"
                placeholder="Enter your email"
                class="w-full border rounded-lg p-3 mt-2 mb-5 outline-none focus:ring-2 focus:ring-blue-500"
            >

            <!-- Password -->

            <label class="font-medium text-gray-700">
                Password
            </label>

            <input
            id="password"
                type="password"
                placeholder="Enter password"
                class="w-full border rounded-lg p-3 mt-2 mb-5 outline-none focus:ring-2 focus:ring-blue-500"
            >

            <!-- Confirm -->

            <label class="font-medium text-gray-700">
                Confirm Password
            </label>

            <input
            id="confirm"
                type="password"
                placeholder="Confirm password"
                class="w-full border rounded-lg p-3 mt-2 mb-6 outline-none focus:ring-2 focus:ring-blue-500"
            >
            <select id="role" class="mb-5 p-2">
    <option value="">Select Role</option>
    <option value="Admin">Admin</option>
    <option value="Employee">Employee</option>
</select>

            <button class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-3 font-semibold duration-300" onclick="register()">
                Register
            </button>


            <div class="flex items-center my-6">
                <hr class="flex-1">
                <span class="mx-3 text-gray-500">OR</span>
                <hr class="flex-1">
            </div>

            <button class="w-full border rounded-lg py-3 hover:bg-gray-100 font-medium">
                Continue with Google
            </button>

            <p class="text-center mt-6">
                Already have an account?
                <a href="../OAMS/Login.html" class="text-blue-600 font-semibold">
                    Sign In
                </a>
            </p>

        </div>

        <!-- Image -->

        <div class="w-1/2">

            <img
                src="../assets/register_img.jpg"
                class="w-full h-full object-cover"
                alt="Register Image"
            >

        </div>

    </div>

</div>
<script>
const register=()=>{
    let name=document.getElementById("name").value
     let email=document.getElementById("email").value
     let password=document.getElementById("password").value 
     let confirm=document.getElementById("confirm").value
     let role=document.getElementById("role").value
    
     if(name==""||email==""||password==""||confirm==""||role==""){
        alert("Fill all Feild")
        return
     }
     if(password!=confirm){
        alert("Password do not Match")
        return
     }
     let users=JSON.parse(localStorage.getItem("users"))||[]
    
     
     let check =users.find(users=>users.email===email)
     if(check){
        alert("Email already Registered")
        return
     }
    users.push({name,email,password,role})
    localStorage.setItem("users",JSON.stringify(users)) 
    console.log(users);
    
    alert("Registered Successfully")
    window.location="Login.html"
     
}
</script>

</body>
</html>
