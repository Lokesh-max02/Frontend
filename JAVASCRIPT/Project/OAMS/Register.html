<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../Style/register.css">
</head>
<body>
   
    <div class="mains">
    
     <div class="form" id="parent1">
        <div>
           <h1 class="text-3xl mb-3 font-semibold">Create an Account</h1>
        </div>
        <div class="inputbox">
            <div>
            <label >Name</label>
            <br/>
            <input class="bg-white p-1 rounded mb-3" type="text" placeholder="Enter a Name">
            <br/>
            <label >Email</label>
            <br/>
            <input class="bg-white p-1 rounded mb-3" type="email" placeholder="Enter a Email">
            <br/>
            <label >Password</label>
            <br/>
            <input class="bg-white p-1 rounded mb-3" type="password">
            <br/>
            <label >Confirm Password</label>
            <br/>
            <input class="bg-white p-1 rounded mb-3" type="password">
            <br/>
            <button class="bg-blue-600 w-50 rounded mb-5 p-2">Register</button>
        </div>
        
        <div>
            <p class="mb-3">--------Or Register With--------</p>
            <a class="bg-white p-2 text-red-500 mb-5" href="#">Google</a>
       
        </div>
        <div>
            Already Have An Account? <a class="text-blue-700" href="../OAMS/Login.html">Sign In</a>
        </div>
        </div>
    </div>
    <div class="img-reg">
        <img class="rounded-l"   src="../assets/register_img.jpg" alt="" width="400">
    </div>
   </div>
   
</body>
</html>
