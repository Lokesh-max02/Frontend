<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Assets Management - Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-900 via-blue-700 to-cyan-500">

    <div class="w-full max-w-md px-6">

        <div class="backdrop-blur-lg bg-white/20 border border-white/30 shadow-2xl rounded-3xl p-8">

            <div class="text-center mb-8">

                <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto shadow-lg">
                    <span class="text-4xl">🏢</span>
                </div>

                <h1 class="text-3xl font-bold text-white mt-4">
                    Office Assets
                </h1>

                <p class="text-gray-200 mt-2">
                    Management System
                </p>

            </div>

            <form>

                <div class="mb-5">

                    <label class="block text-white mb-2 font-medium">
                        Email
                    </label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        class="w-full px-4 py-3 rounded-xl bg-white text-gray-700 outline-none focus:ring-4 focus:ring-blue-400"
                    >

                </div>

                <div class="mb-5">

                    <label class="block text-white mb-2 font-medium">
                        Password
                    </label>

                    <input
                        type="password"
                        placeholder="Enter your password"
                        class="w-full px-4 py-3 rounded-xl bg-white text-gray-700 outline-none focus:ring-4 focus:ring-blue-400"
                    >

                </div>

                <div class="flex justify-between items-center mb-6 text-sm">

                    <label class="flex items-center gap-2 text-white">
                        <input type="checkbox" class="accent-blue-600">
                        Remember Me
                    </label>

                    <a href="#" class="text-blue-200 hover:text-white">
                        Forgot Password?
                    </a>

                </div>

                <a href="../OAMS/Dashboard.html"
                   class="block w-full bg-blue-600 hover:bg-blue-700 duration-300 text-center text-white font-semibold py-3 rounded-xl shadow-lg">
                    LOGIN
                </a>

            </form>

        </div>

    </div>

</body>
</html>
